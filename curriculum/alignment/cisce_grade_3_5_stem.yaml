# CISCE Grade 3–5 STEM crosswalk (draft after human PDF review).
# CISCE is the alignment authority only: the official PDF is not ingested,
# embedded, or retrieved. Summaries are short paraphrases, not excerpts.
#
# Printed page numbers refer to the 2025 PrimaryCurriculum.pdf
# (curriculum/raw/_alignment_only/cisce/PrimaryCurriculum.pdf).
# Science Class III begins at printed p.154, Class IV at p.165, Class V at p.178.
# Mathematics Class III begins at printed p.82, Class IV at p.90, Class V at p.101.
#
# Every mapping stays needs_human_review. ALIGN_STRICT must not treat this file
# as approved. Empty mapped_units means no ingested source is claimed.
# Removed as CISCE mappings (do not restore as strict): Class III fractions,
# Class III weather/seasons, Class IV Earth/sky/planets, Class IV angles (M4),
# Class IV decimals (M6), Class V coordinate plane (M6).

